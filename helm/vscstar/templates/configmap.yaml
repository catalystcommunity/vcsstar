apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vscstar.fullname" . }}
  labels:
    {{- include "vscstar.labels" . | nindent 4 }}
data:
  VSCSTAR__LISTEN_HTTP: "0.0.0.0:{{ .Values.server.httpPort }}"
  VSCSTAR__LISTEN_RPC: "0.0.0.0:{{ .Values.server.rpcPort }}"
  VSCSTAR__PUBLIC_URL: {{ .Values.server.publicUrl | quote }}
  VSCSTAR__INSTANCE_DOMAIN: {{ .Values.server.instanceDomain | quote }}
  VSCSTAR__INSTANCE_IDENTITY: {{ .Values.server.instanceIdentity | quote }}
  VSCSTAR__INSTANCE_ADMINS: {{ .Values.server.instanceAdmins | quote }}
  VSCSTAR__OPEN_ORG_CREATION: {{ .Values.server.openOrgCreation | quote }}
  RUST_LOG: {{ .Values.server.logFilter | quote }}
  {{- with .Values.linkkeys.rpAddr }}
  VSCSTAR__LINKKEYS_RP_ADDR: {{ . | quote }}
  {{- end }}
  {{- with .Values.linkkeys.rpFingerprints }}
  VSCSTAR__LINKKEYS_RP_FINGERPRINTS: {{ . | quote }}
  {{- end }}
  {{- with .Values.linkkeys.rpDomain }}
  VSCSTAR__LINKKEYS_RP_DOMAIN: {{ . | quote }}
  {{- end }}
  {{- with .Values.corndogs.addr }}
  VSCSTAR__CORNDOGS_ADDR: {{ . | quote }}
  VSCSTAR__CORNDOGS_TLS: {{ $.Values.corndogs.tls | quote }}
  {{- end }}
  {{- with .Values.objectStore.endpoint }}
  VSCSTAR__OBJECT_STORE_ENDPOINT: {{ . | quote }}
  VSCSTAR__OBJECT_STORE_BUCKET: {{ $.Values.objectStore.bucket | quote }}
  VSCSTAR__OBJECT_STORE_REGION: {{ $.Values.objectStore.region | quote }}
  {{- end }}
