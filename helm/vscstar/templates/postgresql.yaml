{{- if .Values.postgresql.enabled }}
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: {{ include "vscstar.fullname" . }}-postgres
  labels:
    {{- include "vscstar.labels" . | nindent 4 }}
spec:
  teamId: {{ .Values.postgresql.teamId }}
  numberOfInstances: {{ .Values.postgresql.instances }}
  postgresql:
    version: {{ .Values.postgresql.version | quote }}
  databases:
    {{ .Values.postgresql.database }}: {{ .Values.postgresql.user }}
  users:
    {{ .Values.postgresql.user }}:
      - superuser
      - createdb
  volume:
    size: {{ .Values.postgresql.storage.size }}
{{- end }}
