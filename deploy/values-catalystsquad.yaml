# vscstar.catalystsquad.com: the first instance. Deployed by
# .reactorcide/jobs/deploy-catalystsquad.yaml into namespace `vscstar`.
server:
  publicUrl: "https://vscstar.catalystsquad.com"
  instanceDomain: "catalystsquad.com"
  instanceIdentity: "vscstar@catalystsquad.com"
  # The service account that owns the LinkKeys app registration is the
  # first instance admin; human admins are added through Orgs ops.
  instanceAdmins: "01a1bec7-a7ee-7053-a3a5-597567b45172@catalystsquad.com"

linkkeys:
  rpAddr: "linkkeys-catalystsquad.linkkeys-catalystsquad.svc.cluster.local:4987"
  # From `dig TXT _linkkeys.catalystsquad.com`, checked 2026-11-08.
  rpFingerprints: "c20dadc7bea8ecf47c2d2f43ff78004c5bad28d5f56874c142ddd76c888aaf06,50d7df1ea0298a90d38ed5d7c366172944d7bbed56d9fbd3e9a6e23e39ed7360,63a01719e9df06d7f33b206d301382c610703fc72dd0b54ed11e15faea3c3b80"
  rpDomain: "catalystsquad.com"
  existingSecret: "vscstar-linkkeys"

postgresql:
  enabled: true
  storage:
    size: 10Gi

objectStore:
  endpoint: "http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
  bucket: "vscstar-catalystsquad"
  existingSecret: "vscstar-objectstore"

gateway:
  httpRoute:
    enabled: true
    parentGateway: contour
    parentNamespace: projectcontour
    parentSection: http
    hostnames:
      - vscstar.catalystsquad.com
