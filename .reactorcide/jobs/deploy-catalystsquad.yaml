name: vcsstar-deploy-catalystsquad
description: "Build the vcsstar image with buildkit and deploy it with Helm"
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "bash ${REACTORCIDE_CODE_DIR:-/job/src}/.reactorcide/jobs/scripts/deploy.sh"
  timeout: 3600
  capabilities:
    - builder
  disable_run_local: true
  resources:
    cpu:
      request: "2"
      limit: "4"
    memory:
      limit: "8Gi"
environment:
  REGISTRY: "containers.catalystsquad.com"
  IMAGE_PATH: "public/catalystcommunity/vcsstar"
  CLI_IMAGE_PATH: "public/catalystcommunity/vcsstar-cli"
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
  KUBECONFIG_CONTENT: "${secret:catalystcommunity/k8s:kubeconfig}"
  LINKKEYS_API_KEY: "${secret:catalystcommunity/ci:vcsstar-api-key}"
  K8S_NAMESPACE: "vcsstar"
  HELM_RELEASE: "vcsstar"
  # The instance overlay (see deploy/values-example.yaml) lives in the secret store.
  DEPLOY_VALUES: "${secret:catalystcommunity/vcsstar:values-catalystsquad}"
