# Set REACTORCIDE_API_TOKEN to a grant administrator token.
# reactorcide secret-grants --api-url https://reactorcide.catalystsquad.com \
#   apply --file .reactorcide/secret-grants.yaml
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: vcsstar-deploy-registry
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-deploy-k8s
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/k8s
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-deploy-ci
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-deploy-values
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/vcsstar
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-release-tag
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: vcsstar-release-tag
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      refClasses:
        any: [default]
  - metadata:
      name: vcsstar-release-prepare
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: vcsstar-release-prepare
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      refClasses:
        any: [tag]
  - metadata:
      name: vcsstar-release-cli
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: vcsstar-release-cli
          match: prefix
      executionProfiles: [standard]
      ciOrigins: [base]
      refClasses:
        any: [tag]
  - metadata:
      name: vcsstar-release-server
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: vcsstar-release-server
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      refClasses:
        any: [tag]
  - metadata:
      name: vcsstar-release-publish
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: vcsstar-release-publish
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      refClasses:
        any: [tag]
