# Secret grants for vcsstar CI nodes. Apply with:
#   reactorcide secret-grants apply --file .reactorcide/secret-grants.yaml \
#     --api-url https://reactorcide.catalystsquad.com --token <admin-token>
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: vcsstar-deploy-registry
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-deploy-k8s
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/k8s
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-deploy-ci
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
  - metadata:
      name: vcsstar-deploy-values
    spec:
      scope:
        project: github.com/catalystcommunity/vcsstar
      secret:
        path: catalystcommunity/vcsstar
        match: exact
      subject:
        jobName:
          value: vcsstar-deploy-catalystsquad
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
