id: vcsstar-main
name: vcsstar main branch checks
on:
  events:
    - push
  branches:
    - main
jobs:
  vcsstar-gen-check:
    job_file: gen-check.yaml
  vcsstar-test:
    job_file: test.yaml
  vcsstar-ui:
    job_file: ui.yaml
  vcsstar-release-tag:
    job_file: release-control.yaml
    depends_on: [vcsstar-gen-check, vcsstar-test, vcsstar-ui]
    environment:
      RELEASE_STEP: tag
